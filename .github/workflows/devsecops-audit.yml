name: DevSecOps & FinOps Guardrails

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

  audit:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Exits non-zero if any audit stage fails or a HIGH/CRITICAL finding
      # is reported, so the check blocks the merge.
      - name: Run AegisOps audits
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: go run ./cmd/aegisops
